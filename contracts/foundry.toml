[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
